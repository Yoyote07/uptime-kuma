# Construit l'image Docker "homelab" de Uptime Kuma et la publie sur GitHub Packages (ghcr.io)
name: Build homelab image

on:
  push:
    # homelab : construit ET publie l'image
    # build-test : construit seulement, pour vérifier que ça compile avant homelab
    branches: [homelab, build-test]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'interface (dist/)
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          target: release
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/homelab' }}
          tags: |
            ghcr.io/yoyote07/uptime-kuma:homelab
            ghcr.io/yoyote07/uptime-kuma:homelab-${{ github.sha }}
